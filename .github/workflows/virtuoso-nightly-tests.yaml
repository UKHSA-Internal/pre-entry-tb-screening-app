name: Run Virtuoso Plan

on:
  schedule:
    - cron: "0 1 * * 1-5"   # 1 AM UTC, Monday–Friday
  workflow_dispatch:
    inputs:
      plan_id:
        description: "Plan ID"
        default: "5"
        required: true
      plan_name:
        description: "Plan name"
        required: false
      environment:
        description: "Environment to test"
        required: true
        default: "all"
        type: choice
        options: [all, qat, dev, preprod]
      branch:
        description: "Branch label (informational)"
        required: false
        default: "develop"
        type: string
  workflow_call:
    inputs:
      plan_id:
        required: true
        type: string
      plan_name:
        required: false
        type: string
      environment_id:
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  # ─────────────────────────────────────────────────────────────────────────
  # 1. Build the environment list
  #    Skipped when called via workflow_call — the caller controls the env.
  # ─────────────────────────────────────────────────────────────────────────
  setup-matrix:
    name: Setup Environment Matrix
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_call'
    outputs:
      environments: ${{ steps.matrix.outputs.environments }}
      branch: ${{ steps.matrix.outputs.branch }}
    steps:
      - name: Build matrix
        id: matrix
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV_SELECTION="${{ github.event.inputs.environment }}"
            BRANCH="${{ github.event.inputs.branch }}"
          else
            ENV_SELECTION="all"
            BRANCH="${{ github.ref_name }}"
          fi

          if [[ "$ENV_SELECTION" == "all" ]]; then
            ENV_ARRAY='["qat","dev","preprod"]'
          else
            ENV_ARRAY='["'"$ENV_SELECTION"'"]'
          fi

          echo "environments=$ENV_ARRAY" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH"          >> "$GITHUB_OUTPUT"
          echo "Selected environments: $ENV_ARRAY"

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Execute the Virtuoso plan
  #
  #    • Triggered by schedule/workflow_dispatch: runs as a matrix across
  #      environments. ENVIRONMENT_ID is set per matrix entry.
  #    • Triggered by workflow_call: runs as a single job. ENVIRONMENT_ID
  #      comes from the workflow_call input.
  #
  # ─────────────────────────────────────────────────────────────────────────
  run-virtuoso-plan:
    name: Run Virtuoso Plan – ${{ matrix.environment || 'default' }}
    runs-on: ubuntu-latest
    needs: [setup-matrix]
    if: always() && (needs.setup-matrix.result == 'success' || needs.setup-matrix.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ github.event_name != 'workflow_call' && fromJson(needs.setup-matrix.outputs.environments) || fromJson('["default"]') }}
        include:
          - environment: qat
            virtuoso_env_id: "98"
          - environment: dev
            virtuoso_env_id: "435"
          - environment: preprod
            virtuoso_env_id: "442"
          - environment: default
            virtuoso_env_id: ""      # workflow_call path — env ID comes from input

    env:
      VIRTUOSO_TOKEN: ${{ secrets.VIRTUOSOUKPRD_API_TOKEN }}
      PLAN_ID: ${{ inputs.plan_id || '5' }}
      PLAN_NAME: ${{ inputs.plan_name || 'CI/CD_PETS' }}
      # workflow_call supplies environment_id via input; matrix jobs use virtuoso_env_id
      ENVIRONMENT_ID: ${{ inputs.environment_id || matrix.virtuoso_env_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Guard: workflow_call callers must supply environment_id.
      # Without it ENVIRONMENT_ID is empty and execute.sh will target the wrong env.
      - name: Validate environment ID (workflow_call only)
        if: github.event_name == 'workflow_call'
        run: |
          if [[ -z "$ENVIRONMENT_ID" ]]; then
            echo "::error::workflow_call requires the environment_id input to be set."
            echo "::error::Check Virtuoso → Settings → Environments for the correct ID."
            exit 1
          fi
          echo "environment_id=$ENVIRONMENT_ID"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Make script executable
        run: chmod +x scripts/execute.sh

      # continue-on-error so transform + upload steps always run and the
      # dashboard reflects the real result rather than a missing artifact.
      - name: Run Virtuoso plan
        id: virtuoso_run
        continue-on-error: true
        run: scripts/execute.sh

      - name: Move report to reports folder
        if: always()
        run: |
          mkdir -p reports
          if [ -f plan_execution_report.json ]; then
            mv plan_execution_report.json reports/plan_execution_report.json
          else
            # Script failed before producing a report — write a stub so the
            # transform step still emits a clean FAIL result for the dashboard.
            # .jobs must be an object (keyed) to match the real Virtuoso response shape.
            echo '{"outcome":"ERROR","jobs":{}}' > reports/plan_execution_report.json
          fi

      # ── Transform plan_execution_report.json → per-browser result files ──
      #
      # Confirmed Virtuoso API field names (from plan_execution_report.json):
      #   .statistics.journeyLevel.outcome    "PASS" | "FAIL" | "ERROR"  (overall)
      #   .jobs                               keyed object  { "jobId": { ... }, ... }
      #   .jobs.<id>.outcome                  "PASS" | "FAIL" | "ERROR"
      #   .jobs.<id>.browser                  "CHROME" | "FIREFOX" | "EDGE"
      #   .jobs.<id>.totalTestExecutions      integer
      #   .jobs.<id>.successfulTestExecutions integer
      #   .jobs.<id>.failedTestExecutions     integer
      #   .jobs.<id>.skippedTestExecutions    integer
      #
      # When no .browser field is present (single-job plan) the first job is
      # mapped to Chrome; Firefox and Edge are marked SKIP (no data, not a failure).
      - name: Transform results to dashboard format
        if: always() && github.event_name != 'workflow_call'
        run: |
          ENVIRONMENT="${{ matrix.environment }}"
          REPORT="reports/plan_execution_report.json"
          BROWSERS=("chrome" "firefox" "edge")

          for BROWSER in "${BROWSERS[@]}"; do
            BROWSER_UPPER=$(echo "$BROWSER" | tr '[:lower:]' '[:upper:]')

            # .jobs is a keyed object — iterate values via to_entries
            JOB=$(jq -c \
              --arg b "$BROWSER_UPPER" \
              '.jobs | to_entries[].value | select((.browser // "" | ascii_upcase) == $b)' \
              "$REPORT" 2>/dev/null | head -1 || true)

            # Fallback: if no job carries a .browser field, map the single job
            # to chrome only; leave firefox/edge as SKIP (no data, not a failure).
            if [[ -z "$JOB" && "$BROWSER" == "chrome" ]]; then
              HAS_BROWSER=$(jq '[.jobs | to_entries[].value | .browser] | map(select(. != null)) | length' \
                "$REPORT" 2>/dev/null || echo "0")
              if [[ "$HAS_BROWSER" == "0" ]]; then
                JOB=$(jq -c '.jobs | to_entries[0].value // empty' "$REPORT" 2>/dev/null || true)
              fi
            fi

            if [[ -n "$JOB" ]]; then
              OUTCOME=$(echo "$JOB" | jq -r '.outcome // "UNKNOWN"')
              TOTAL=$(echo   "$JOB" | jq -r '.totalTestExecutions        // 0')
              PASSED=$(echo  "$JOB" | jq -r '.successfulTestExecutions   // 0')
              FAILED=$(echo  "$JOB" | jq -r '.failedTestExecutions       // 0')
              PENDING=$(echo "$JOB" | jq -r '.skippedTestExecutions      // 0')
              STATUS=$([[ "$OUTCOME" == "PASS" ]] && echo "PASS" || echo "FAIL")
            else
              # No data for this browser — SKIP, not FAIL
              STATUS="SKIP"; TOTAL=0; PASSED=0; FAILED=0; PENDING=0
            fi

            mkdir -p "result-${ENVIRONMENT}-${BROWSER}"
            echo "$STATUS" > "result-${ENVIRONMENT}-${BROWSER}/result.txt"

            # Use jq to build result.json — prevents invalid JSON if any
            # variable contains quotes, newlines, or other special characters.
            jq -n \
              --arg     status      "$STATUS" \
              --arg     environment "$ENVIRONMENT" \
              --arg     browser     "$BROWSER" \
              --argjson total       "${TOTAL:-0}" \
              --argjson passed      "${PASSED:-0}" \
              --argjson failed      "${FAILED:-0}" \
              --argjson pending     "${PENDING:-0}" \
              --arg     timestamp   "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg     runId       "${{ github.run_id }}" \
              '{
                "status":      $status,
                "environment": $environment,
                "browser":     $browser,
                "testCounts": {
                  "total":   $total,
                  "passed":  $passed,
                  "failed":  $failed,
                  "pending": $pending
                },
                "timestamp": $timestamp,
                "runId":     $runId
              }' > "result-${ENVIRONMENT}-${BROWSER}/result.json"

            echo "result-${ENVIRONMENT}-${BROWSER}: status=$STATUS  total=$TOTAL  passed=$PASSED  failed=$FAILED"
          done

      - name: Upload Chrome result
        if: always() && github.event_name != 'workflow_call'
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.environment }}-chrome
          path: result-${{ matrix.environment }}-chrome/
          retention-days: 7

      - name: Upload Firefox result
        if: always() && github.event_name != 'workflow_call'
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.environment }}-firefox
          path: result-${{ matrix.environment }}-firefox/
          retention-days: 7

      - name: Upload Edge result
        if: always() && github.event_name != 'workflow_call'
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.environment }}-edge
          path: result-${{ matrix.environment }}-edge/
          retention-days: 7

      # The raw report is uploaded for all trigger types — useful for debugging.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-report-${{ inputs.plan_id || env.PLAN_ID }}-${{ github.run_attempt }}
          path: reports/plan_execution_report.json
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # 3. Aggregate results and deploy the GitHub Pages dashboard
  #    Only runs on schedule / workflow_dispatch — not on workflow_call,
  #    where the caller is responsible for any downstream steps.
  # ─────────────────────────────────────────────────────────────────────────
  generate-summary-and-deploy:
    name: Generate Summary and Deploy Dashboard
    needs: [setup-matrix, run-virtuoso-plan]
    if: always() && github.event_name != 'workflow_call'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install required tools
        run: sudo apt-get update && sudo apt-get install -y jq bc

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: List downloaded artifacts
        run: |
          echo "=== Downloaded Artifacts ==="
          find all-artifacts -type f | sort

      - name: Create dashboard directory
        run: mkdir -p dashboard

      - name: Generate test summary report
        id: summary
        run: |
          echo "# 🌙 PETS Nightly Test Results" > nightly-summary.md
          echo "" >> nightly-summary.md
          echo "**Run Date**: $(date -u)" >> nightly-summary.md
          echo "**Run ID**: ${{ github.run_id }}" >> nightly-summary.md
          echo "**Branch**: ${{ needs.setup-matrix.outputs.branch }}" >> nightly-summary.md
          echo "" >> nightly-summary.md

          ENV_MATRIX='${{ needs.setup-matrix.outputs.environments }}'
          BROWSER_LIST=("chrome" "firefox" "edge")
          ENV_LIST=($(echo "$ENV_MATRIX" | jq -r '.[]'))

          TOTAL=0; FAILS=0
          TOTAL_TESTS=0; TOTAL_PASSED=0; TOTAL_FAILED=0; TOTAL_PENDING=0

          # Accumulate results as a jq object — avoids invalid JSON from
          # special characters in any variable (branch names, plan names, etc.)
          RESULTS_JSON='{}'

          for env in "${ENV_LIST[@]}"; do
            echo "## Environment: ${env^^}" >> nightly-summary.md
            echo "" >> nightly-summary.md
            echo "| Browser | Status | Total | Passed | Failed | Pending |" >> nightly-summary.md
            echo "|---------|--------|-------|--------|--------|---------|" >> nightly-summary.md

            ENV_OBJ='{}'

            for browser in "${BROWSER_LIST[@]}"; do
              RESULT_DIR="all-artifacts/result-${env}-${browser}"
              STATUS="UNKNOWN"
              TEST_COUNT=0; PASSED_COUNT=0; FAILED_COUNT=0; PENDING_COUNT=0

              [[ -f "$RESULT_DIR/result.txt" ]] && STATUS=$(cat "$RESULT_DIR/result.txt") || true

              if [[ -f "$RESULT_DIR/result.json" ]]; then
                TEST_COUNT=$(jq    -r '.testCounts.total   // 0' "$RESULT_DIR/result.json" 2>/dev/null || echo 0)
                PASSED_COUNT=$(jq  -r '.testCounts.passed  // 0' "$RESULT_DIR/result.json" 2>/dev/null || echo 0)
                FAILED_COUNT=$(jq  -r '.testCounts.failed  // 0' "$RESULT_DIR/result.json" 2>/dev/null || echo 0)
                PENDING_COUNT=$(jq -r '.testCounts.pending // 0' "$RESULT_DIR/result.json" 2>/dev/null || echo 0)
              fi

              STATUS_ICON=$([ "$STATUS" = "PASS" ] && echo "✅" || [ "$STATUS" = "SKIP" ] && echo "⏭️" || echo "❌")
              echo "| $browser | $STATUS_ICON $STATUS | $TEST_COUNT | $PASSED_COUNT | $FAILED_COUNT | $PENDING_COUNT |" >> nightly-summary.md

              # Build per-browser JSON object via jq — all values safely typed
              BROWSER_OBJ=$(jq -n \
                --arg     status  "$STATUS" \
                --argjson total   "${TEST_COUNT:-0}" \
                --argjson passed  "${PASSED_COUNT:-0}" \
                --argjson failed  "${FAILED_COUNT:-0}" \
                --argjson pending "${PENDING_COUNT:-0}" \
                '{"status": $status, "testCounts": {"total": $total, "passed": $passed, "failed": $failed, "pending": $pending}}')

              # Merge browser object into the env object
              ENV_OBJ=$(echo "$ENV_OBJ" | jq \
                --arg     b    "$browser" \
                --argjson bobj "$BROWSER_OBJ" \
                '. + {($b): $bobj}')

              # Only count non-SKIP browsers toward combinations and overall status
              if [[ "$STATUS" != "SKIP" ]]; then
                TOTAL=$((TOTAL + 1))
                [[ "$STATUS" != "PASS" ]] && FAILS=$((FAILS + 1))
              fi
              TOTAL_TESTS=$((TOTAL_TESTS     + TEST_COUNT))
              TOTAL_PASSED=$((TOTAL_PASSED   + PASSED_COUNT))
              TOTAL_FAILED=$((TOTAL_FAILED   + FAILED_COUNT))
              TOTAL_PENDING=$((TOTAL_PENDING + PENDING_COUNT))
            done

            # Merge env object into the top-level results object
            RESULTS_JSON=$(echo "$RESULTS_JSON" | jq \
              --arg     e    "$env" \
              --argjson eobj "$ENV_OBJ" \
              '. + {($e): $eobj}')

            echo "" >> nightly-summary.md
          done

          # Success rate based on actual test counts (not combinations)
          SUCCESS_RATE=0
          [[ $TOTAL_TESTS -gt 0 ]] && SUCCESS_RATE=$(echo "scale=1; $TOTAL_PASSED * 100 / $TOTAL_TESTS" | bc)
          # bc may output .N instead of 0.N on some systems — normalise to valid JSON
          SUCCESS_RATE=$(echo "$SUCCESS_RATE" | sed 's/^\./0./')

          OVERALL_STATUS="PASS"
          [[ $FAILS -gt 0 ]] && OVERALL_STATUS="FAIL"

          echo "## 📊 Overall Summary" >> nightly-summary.md
          echo "" >> nightly-summary.md
          echo "- **Test Combinations**: $TOTAL"          >> nightly-summary.md
          echo "- **Failed Combinations**: $FAILS"        >> nightly-summary.md
          echo "- **Test Pass Rate**: ${SUCCESS_RATE}%"   >> nightly-summary.md
          echo "- **Total Tests Run**: $TOTAL_TESTS"      >> nightly-summary.md
          echo "- **Tests Passed**: $TOTAL_PASSED"        >> nightly-summary.md
          echo "- **Tests Failed**: $TOTAL_FAILED"        >> nightly-summary.md
          echo "- **Tests Pending**: $TOTAL_PENDING"      >> nightly-summary.md

          if [[ "$OVERALL_STATUS" == "PASS" ]]; then
            echo "## ✅ Status: ALL TESTS PASSED" >> nightly-summary.md
          else
            echo "## ❌ Status: SOME TESTS FAILED" >> nightly-summary.md
          fi

          # Write final test-results.json entirely via jq — no string concatenation
          jq -n \
            --argjson results             "$RESULTS_JSON" \
            --arg     overallStatus       "$OVERALL_STATUS" \
            --argjson totalCombinations   $TOTAL \
            --argjson failedCombinations  $FAILS \
            --argjson totalTests          $TOTAL_TESTS \
            --argjson totalPassed         $TOTAL_PASSED \
            --argjson totalFailed         $TOTAL_FAILED \
            --argjson totalPending        $TOTAL_PENDING \
            --argjson successRate         $SUCCESS_RATE \
            --arg     runUrl              "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg     branch              "${{ needs.setup-matrix.outputs.branch }}" \
            --arg     timestamp           "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              "results":            $results,
              "overallStatus":      $overallStatus,
              "totalCombinations":  $totalCombinations,
              "failedCombinations": $failedCombinations,
              "totalTests":         $totalTests,
              "totalPassed":        $totalPassed,
              "totalFailed":        $totalFailed,
              "totalPending":       $totalPending,
              "successRate":        $successRate,
              "runUrl":             $runUrl,
              "branch":             $branch,
              "timestamp":          $timestamp
            }' > dashboard/test-results.json

          echo "overall_status=$OVERALL_STATUS" >> "$GITHUB_OUTPUT"
          echo "success_rate=$SUCCESS_RATE"     >> "$GITHUB_OUTPUT"

      - name: Copy dashboard HTML
        run: cp .github/workflows/PETSNightlyDashboard.html dashboard/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dashboard"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload summary report
        uses: actions/upload-artifact@v4
        with:
          name: nightly-summary-report
          path: nightly-summary.md
          retention-days: 7

      - name: Set workflow conclusion
        if: always()
        run: |
          echo "🔗 Dashboard URL: ${{ steps.deployment.outputs.page_url }}"
          if [[ "${{ steps.summary.outputs.overall_status }}" == "PASS" ]]; then
            echo "::notice::✅ All PETS nightly tests passed! Dashboard: ${{ steps.deployment.outputs.page_url }}"
          else
            echo "::warning::⚠️ Some tests failed. Dashboard: ${{ steps.deployment.outputs.page_url }}"
          fi